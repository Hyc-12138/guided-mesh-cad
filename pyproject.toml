[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-mesh-cad"
version = "0.3.0.dev15+public.1"
description = "Guided multi-patch mesh to native BRep reconstruction and validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.13,<2", "cadquery==2.8.0", "vtk>=9.6,<9.7"]

[project.scripts]
guided-mesh-cad = "guided_mesh_cad.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["guided_mesh_cad", "guided_mesh_cad.*"]
