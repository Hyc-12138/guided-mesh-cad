[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-mesh-cad"
version = "0.3.0.dev23+public.1"
description = "Evidence-bound, guided multi-patch freeform mesh to native BRep reconstruction"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scipy>=1.13,<2", "cadquery==2.8.0", "vtk>=9.6,<9.7"]

[project.optional-dependencies]
acceleration = ["numba"]

[project.scripts]
guided-mesh-cad = "guided_mesh_cad.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guided_mesh_cad = ["docs/*.md"]

